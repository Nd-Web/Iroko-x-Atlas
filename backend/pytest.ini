[pytest]
# Scoped to the ingestion subsystem for now. The pre-existing backend/tests/
# suite has failures that predate this work; widening testpaths would mix those
# baseline failures into the per-phase checklist and make it dishonest.
testpaths = tests/ingestion
asyncio_mode = auto
markers =
    integration: needs real infrastructure (Postgres, Azurite, Azure AI Search)
    live: hits real regulator sites; excluded by default, never in CI
addopts = -m "not live" --strict-markers -q
